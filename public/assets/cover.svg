<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- Background Radial Warm Glow -->
    <radialGradient id="spotlightGlow" cx="85%" cy="16%" r="68%">
      <stop offset="0%" stop-color="#ffd566" stop-opacity="0.38"/>
      <stop offset="25%" stop-color="#d4af37" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#735414" stop-opacity="0.10"/>
      <stop offset="85%" stop-color="#121318" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#0b0c0f" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom Vintage Tool Subtle Glow -->
    <radialGradient id="bottomGlow" cx="50%" cy="88%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0b0c0f" stop-opacity="0"/>
    </radialGradient>

    <!-- Rich 3D Gold Metallic Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4ba"/>
      <stop offset="20%" stop-color="#f5d77f"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="65%" stop-color="#9a741a"/>
      <stop offset="85%" stop-color="#f0cb64"/>
      <stop offset="100%" stop-color="#a0781c"/>
    </linearGradient>

    <!-- Deep Bevel Gold Shadow Gradient -->
    <linearGradient id="goldShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#543c0a"/>
      <stop offset="50%" stop-color="#2d2005"/>
      <stop offset="100%" stop-color="#140f02"/>
    </linearGradient>

    <!-- Gold Accent Line Gradient -->
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#aa8222" stop-opacity="0.2"/>
      <stop offset="30%" stop-color="#f5d77f" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#d4af37" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#aa8222" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Border Frame Gradient -->
    <linearGradient id="frameGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a691b" stop-opacity="0.4"/>
      <stop offset="25%" stop-color="#ffd566" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#aa8222" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffd566" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Fine Leather Texture Pattern -->
    <pattern id="grainPattern" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.75" fill="#ffffff" fill-opacity="0.015"/>
      <circle cx="4.5" cy="4.5" r="0.75" fill="#000000" fill-opacity="0.12"/>
      <circle cx="4.5" cy="1.5" r="0.6" fill="#ffffff" fill-opacity="0.01"/>
      <circle cx="1.5" cy="4.5" r="0.6" fill="#000000" fill-opacity="0.08"/>
    </pattern>

    <!-- Drop Shadows -->
    <filter id="heavyShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.95"/>
    </filter>

    <filter id="glow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ffe899" flood-opacity="0.3"/>
    </filter>

    <filter id="toolShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- 1. Background Base -->
  <rect width="1080" height="1920" fill="#0e0f13"/>

  <!-- 2. Warm Spotlight Effect from Upper-Right -->
  <rect width="1080" height="1920" fill="url(#spotlightGlow)"/>

  <!-- 3. Bottom Subtle Warmth -->
  <rect width="1080" height="1920" fill="url(#bottomGlow)"/>

  <!-- 4. Grain / Leather Texture Overlay -->
  <rect width="1080" height="1920" fill="url(#grainPattern)"/>

  <!-- 5. Elegant Gold Border Inset Frame -->
  <rect x="36" y="36" width="1008" height="1848" rx="4" fill="none" stroke="url(#frameGold)" stroke-width="2.5" stroke-opacity="0.55"/>
  <rect x="42" y="42" width="996" height="1836" rx="2" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.2"/>

  <!-- 6. TOP TAGLINE: "A SUA BARBEARIA PREMIUM" -->
  <g transform="translate(540, 160)" text-anchor="middle" filter="url(#glow3D)">
    <text font-family="'Cinzel', 'Montserrat', 'Trajan Pro', 'Plus Jakarta Sans', serif" 
          font-size="34" 
          font-weight="700" 
          letter-spacing="14" 
          fill="url(#goldMetallic)">A SUA BARBEARIA PREMIUM</text>
  </g>

  <!-- 7. CENTER EMBLEM: SCISSORS + L & B MONOGRAM -->
  <g transform="translate(540, 680)" filter="url(#heavyShadow)">

    <!-- HORIZONTAL BARS FOR 'L' (Left) -->
    <path d="M-350 -120 L-120 -120" stroke="url(#goldMetallic)" stroke-width="8" stroke-linecap="round"/>
    <path d="M-350 120 L-120 120" stroke="url(#goldMetallic)" stroke-width="8" stroke-linecap="round"/>

    <!-- LETTER 'L' (Vintage Western/Victorian Ornate Serif) -->
    <g transform="translate(-235, 10)" fill="url(#goldMetallic)" filter="url(#glow3D)">
      <!-- 3D depth extrusion for L -->
      <path d="M-40 -90 L10 -90 L10 -70 L-12 -70 L-12 55 L35 55 L42 20 L60 20 L55 75 L-40 75 L-40 55 L-20 55 L-20 -70 L-40 -70 Z" 
            transform="translate(3, 5)" fill="url(#goldShadow)"/>
      <!-- Main Face of L with spurs -->
      <path d="M-40 -90 L10 -90 L10 -70 L-12 -70 L-12 -12 L-2 -8 L-12 -4 L-12 55 L35 55 L42 20 L60 20 L55 75 L-40 75 L-40 55 L-20 55 L-20 0 L-30 -8 L-20 -16 L-20 -70 L-40 -70 Z" 
            stroke="#aa8222" stroke-width="2"/>
    </g>

    <!-- HORIZONTAL BARS FOR 'B' (Right) -->
    <path d="M120 -120 L350 -120" stroke="url(#goldMetallic)" stroke-width="8" stroke-linecap="round"/>
    <path d="M120 120 L350 120" stroke="url(#goldMetallic)" stroke-width="8" stroke-linecap="round"/>

    <!-- LETTER 'B' (Vintage Western/Victorian Ornate Serif) -->
    <g transform="translate(235, 10)" fill="url(#goldMetallic)" filter="url(#glow3D)">
      <!-- 3D depth extrusion for B -->
      <path d="M-40 -90 L20 -90 C45 -90 60 -75 60 -55 C60 -40 48 -30 35 -20 C52 -10 65 5 65 30 C65 55 45 75 15 75 L-40 75 L-40 55 L-20 55 L-20 -70 L-40 -70 Z" 
            transform="translate(3, 5)" fill="url(#goldShadow)"/>
      <!-- Main Face of B with spurs -->
      <path d="M-40 -90 L20 -90 C45 -90 60 -75 60 -55 C60 -40 48 -30 35 -20 C52 -10 65 5 65 30 C65 55 45 75 15 75 L-40 75 L-40 55 L-20 55 L-20 0 L-30 -8 L-20 -16 L-20 -70 L-40 -70 Z
               M-12 -28 L15 -28 C30 -28 38 -36 38 -55 C38 -70 28 -76 15 -76 L-12 -76 Z
               M-12 60 L15 60 C32 60 42 50 42 30 C42 12 30 0 15 0 L-12 0 Z" 
            stroke="#aa8222" stroke-width="2"/>
    </g>

    <!-- CENTRAL GOLDEN BARBER SCISSORS -->
    <g transform="translate(0, -20)" filter="url(#glow3D)">
      <!-- Scissor Pivot Base Drop Shadow -->
      <!-- Left Blade extending up-left -->
      <path d="M-10 40 L-18 10 L-68 -240 C-70 -265 -65 -280 -60 -290 C-50 -260 -20 -140 -2 -30 Z" 
            fill="url(#goldMetallic)" stroke="#8f6b15" stroke-width="2"/>
      <!-- Right Blade extending up-right -->
      <path d="M10 40 L18 10 L68 -240 C70 -265 65 -280 60 -290 C50 -260 20 -140 2 -30 Z" 
            fill="url(#goldMetallic)" stroke="#8f6b15" stroke-width="2"/>

      <!-- Blade Sharp Inner Edges Highlight Lines -->
      <path d="M-2 -30 L-58 -280" stroke="#fff8d1" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M2 -30 L58 -280" stroke="#fff8d1" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Central Pivot Plate / Screw -->
      <circle cx="0" cy="45" r="22" fill="url(#goldMetallic)" stroke="#59430c" stroke-width="3"/>
      <circle cx="0" cy="45" r="14" fill="#141108" stroke="#aa8222" stroke-width="2"/>
      <circle cx="0" cy="45" r="6" fill="url(#goldMetallic)"/>

      <!-- Scissor Shanks connecting to finger rings -->
      <!-- Left Shank -->
      <path d="M-14 62 C-25 90 -45 125 -65 145 C-55 155 -38 120 -10 80 Z" fill="url(#goldMetallic)" stroke="#735414" stroke-width="1.5"/>
      <!-- Right Shank with Finger Rest/Tang -->
      <path d="M14 62 C25 90 45 125 65 145 C55 155 38 120 10 80 Z" fill="url(#goldMetallic)" stroke="#735414" stroke-width="1.5"/>

      <!-- Left Finger Ring Loop -->
      <path d="M-65 130 C-95 130 -125 160 -125 200 C-125 240 -95 270 -65 270 C-35 270 -10 240 -10 200 C-10 160 -35 130 -65 130 Z
               M-65 152 C-45 152 -30 172 -30 200 C-30 228 -45 248 -65 248 C-85 248 -102 228 -102 200 C-102 172 -85 152 -65 152 Z"
            fill="url(#goldMetallic)" stroke="#59430c" stroke-width="2.5" fill-rule="evenodd"/>

      <!-- Right Finger Ring Loop -->
      <path d="M65 130 C35 130 10 160 10 200 C10 240 35 270 65 270 C95 270 125 240 125 200 C125 160 95 130 65 130 Z
               M65 152 C85 152 102 172 102 200 C102 228 85 248 65 248 C45 248 30 228 30 200 C30 172 45 152 65 152 Z"
            fill="url(#goldMetallic)" stroke="#59430c" stroke-width="2.5" fill-rule="evenodd"/>

      <!-- Finger Tang / Rest (Curving out from right ring) -->
      <path d="M118 220 C145 235 165 260 168 280 C165 285 150 280 135 262 C125 250 110 242 102 238 Z"
            fill="url(#goldMetallic)" stroke="#735414" stroke-width="2"/>
    </g>
  </g>

  <!-- 8. BRAND NAME TYPOGRAPHY: "LÍDER BARBER'S" -->
  <g transform="translate(540, 1120)" text-anchor="middle" filter="url(#heavyShadow)">
    
    <!-- 3D Extrusion Shadow Layer 4 (Deepest) -->
    <text font-family="'Cinzel Decorative', 'Cinzel', 'Rye', 'Playfair Display', Georgia, serif" 
          font-size="106" 
          font-weight="900" 
          letter-spacing="5" 
          fill="#0a0802"
          y="18">LÍDER BARBER&apos;S</text>

    <!-- 3D Extrusion Layer 3 -->
    <text font-family="'Cinzel Decorative', 'Cinzel', 'Rye', 'Playfair Display', Georgia, serif" 
          font-size="106" 
          font-weight="900" 
          letter-spacing="5" 
          fill="#2b1f06"
          y="14">LÍDER BARBER&apos;S</text>

    <!-- 3D Extrusion Layer 2 -->
    <text font-family="'Cinzel Decorative', 'Cinzel', 'Rye', 'Playfair Display', Georgia, serif" 
          font-size="106" 
          font-weight="900" 
          letter-spacing="5" 
          fill="#59410d"
          y="8">LÍDER BARBER&apos;S</text>

    <!-- 3D Extrusion Layer 1 (Bevel Edge) -->
    <text font-family="'Cinzel Decorative', 'Cinzel', 'Rye', 'Playfair Display', Georgia, serif" 
          font-size="106" 
          font-weight="900" 
          letter-spacing="5" 
          fill="#946f18"
          y="4">LÍDER BARBER&apos;S</text>

    <!-- Front Face (Metallic Gold Gradient with Bevel Stroke) -->
    <text font-family="'Cinzel Decorative', 'Cinzel', 'Rye', 'Playfair Display', Georgia, serif" 
          font-size="106" 
          font-weight="900" 
          letter-spacing="5" 
          fill="url(#goldMetallic)"
          stroke="#423008"
          stroke-width="2.5"
          y="0">LÍDER BARBER&apos;S</text>

    <!-- Front Top Crisp Golden Highlight -->
    <text font-family="'Cinzel Decorative', 'Cinzel', 'Rye', 'Playfair Display', Georgia, serif" 
          font-size="106" 
          font-weight="900" 
          letter-spacing="5" 
          fill="none"
          stroke="#fff7d6"
          stroke-width="1"
          stroke-opacity="0.65"
          y="-1">LÍDER BARBER&apos;S</text>
  </g>

  <!-- 9. BOTTOM WATERMARK: VINTAGE BARBER TOOLS LINE-ART ILLUSTRATION -->
  <g transform="translate(540, 1680)" filter="url(#toolShadow)">
    
    <!-- Fine Gold Line Style for Vintage Etching -->
    <g stroke="url(#goldMetallic)" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.32">

      <!-- STRAIGHT RAZOR (Navalhete Aberto) - Left / Center -->
      <g transform="translate(-280, 0) rotate(-28)">
        <!-- Razor Handle (Scales) -->
        <path d="M-220 0 C-140 -25 40 -25 180 0 C195 5 210 20 200 32 C190 42 165 40 140 38 C20 25 -140 28 -220 12 C-235 8 -240 -2 -220 0 Z" 
              stroke-width="4.5" fill="#0d0e12" fill-opacity="0.4"/>
        <!-- Pivot Pin -->
        <circle cx="160" cy="12" r="7" stroke-width="4" fill="#d4af37"/>
        <circle cx="160" cy="12" r="2.5" fill="#000000"/>
        <!-- Tang & Shank -->
        <path d="M160 12 C185 2 210 2 245 10 C270 18 290 35 320 40" stroke-width="5"/>
        <path d="M245 10 L260 -30 L450 -30 C490 -30 510 -15 520 5 L500 25 L270 20 Z" 
              stroke-width="4.5" fill="#0d0e12" fill-opacity="0.5"/>
        <!-- Hollow Ground Blade Details -->
        <line x1="280" y1="-15" x2="480" y2="-15" stroke-width="2.5" stroke-dasharray="10 5"/>
        <path d="M495 -28 C505 -15 510 5 490 20" stroke-width="3"/>
      </g>

      <!-- SHAVING BRUSH (Pincel de Barbear Clássico) - Center -->
      <g transform="translate(10, 40) rotate(12)">
        <!-- Brush Handle (Turned Wood / Resin) -->
        <path d="M-55 120 C-65 80 -40 50 -35 20 C-45 10 -45 -10 -35 -20 L35 -20 C45 -10 45 10 35 20 C40 50 65 80 55 120 C40 150 -40 150 -55 120 Z" 
              stroke-width="5" fill="#0c0d10" fill-opacity="0.5"/>
        <path d="M-35 20 L35 20" stroke-width="4"/>
        <path d="M-30 60 C-10 68 10 68 30 60" stroke-width="3"/>
        <path d="M-40 100 C-15 112 15 112 40 100" stroke-width="3"/>
        <!-- Metal Ferrule -->
        <rect x="-35" y="-35" width="70" height="15" rx="3" stroke-width="4"/>
        <!-- Badger Hair Bristles (Rich fan of fine lines) -->
        <path d="M-35 -35 C-70 -90 -85 -160 -45 -220 C-15 -250 15 -250 45 -220 C85 -160 70 -90 35 -35 Z" 
              stroke-width="5" fill="#0e0f13" fill-opacity="0.4"/>
        <!-- Bristle hatching details -->
        <path d="M-20 -35 C-45 -95 -55 -160 -25 -215" stroke-width="2.5"/>
        <path d="M0 -35 C-10 -100 -5 -170 0 -225" stroke-width="2.5"/>
        <path d="M20 -35 C45 -95 55 -160 25 -215" stroke-width="2.5"/>
        <path d="M-10 -35 C-25 -95 -30 -160 -12 -218" stroke-width="1.8"/>
        <path d="M10 -35 C25 -95 30 -160 12 -218" stroke-width="1.8"/>
        <!-- Dark band on badger hair -->
        <path d="M-58 -130 C-20 -145 20 -145 58 -130" stroke-width="4" stroke-dasharray="6 4"/>
      </g>

      <!-- BARBER COMB (Pente de Barbeiro Clássico) - Right -->
      <g transform="translate(260, 20) rotate(52)">
        <!-- Comb Spine / Backbone -->
        <path d="M-190 -22 L190 -22 C205 -22 215 -10 215 5 C215 20 205 30 190 30 L-190 30 C-205 30 -215 20 -215 5 C-215 -10 -205 -22 -190 -22 Z" 
              stroke-width="4.5" fill="#0d0e11" fill-opacity="0.4"/>
        <!-- Comb Fine Teeth (Array of fine lines) -->
        <!-- Wide section teeth -->
        <path d="
          M-180 30 L-180 140 M-168 30 L-168 140 M-156 30 L-156 140 M-144 30 L-144 140 M-132 30 L-132 140
          M-120 30 L-120 140 M-108 30 L-108 140 M-96 30 L-96 140 M-84 30 L-84 140 M-72 30 L-72 140
          M-60 30 L-60 140 M-48 30 L-48 140 M-36 30 L-36 140 M-24 30 L-24 140 M-12 30 L-12 140
          M0 30 L0 140 M12 30 L12 140 M24 30 L24 140 M36 30 L36 140 M48 30 L48 140
          M60 30 L60 140 M72 30 L72 140 M84 30 L84 140 M96 30 L96 140 M108 30 L108 140
          M120 30 L120 140 M132 30 L132 140 M144 30 L144 140 M156 30 L156 140 M168 30 L168 140
          M180 30 L180 140" stroke-width="3"/>
      </g>

      <!-- VINTAGE SAFETY RAZOR (Cabeça de Aparelho Tradicional) - Far Right -->
      <g transform="translate(420, 160) rotate(-15)">
        <path d="M-60 0 C-40 -20 40 -20 60 0 L55 25 L-55 25 Z" stroke-width="4.5" fill="#0d0e12" fill-opacity="0.4"/>
        <line x1="-55" y1="25" x2="55" y2="25" stroke-width="5"/>
        <rect x="-14" y="25" width="28" height="180" rx="6" stroke-width="4.5"/>
        <!-- Knurling texture on handle -->
        <line x1="-14" y1="60" x2="14" y2="70" stroke-width="2"/>
        <line x1="-14" y1="80" x2="14" y2="90" stroke-width="2"/>
        <line x1="-14" y1="100" x2="14" y2="110" stroke-width="2"/>
        <line x1="-14" y1="120" x2="14" y2="130" stroke-width="2"/>
        <line x1="-14" y1="140" x2="14" y2="150" stroke-width="2"/>
        <line x1="-14" y1="160" x2="14" y2="170" stroke-width="2"/>
      </g>

    </g>
  </g>
</svg>