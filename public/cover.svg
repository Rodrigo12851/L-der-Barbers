<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&amp;family=Cinzel+Decorative:wght@700;900&amp;family=Plus+Jakarta+Sans:wght@700&amp;display=swap');
      .tagline {
        font-family: 'Cinzel', 'Plus Jakarta Sans', Georgia, serif;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 13px;
      }
      .brand-name {
        font-family: 'Cinzel Decorative', 'Cinzel', 'Playfair Display', Georgia, serif;
        font-size: 104px;
        font-weight: 900;
        letter-spacing: 6px;
      }
    </style>

    <!-- Warm Spotlight Upper Right -->
    <radialGradient id="topRightGlow" cx="84%" cy="15%" r="68%">
      <stop offset="0%" stop-color="#ffd566" stop-opacity="0.42"/>
      <stop offset="25%" stop-color="#d4af37" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#735414" stop-opacity="0.12"/>
      <stop offset="80%" stop-color="#14151b" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0a0b0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom Vintage Tool Soft Glow -->
    <radialGradient id="bottomToolGlow" cx="50%" cy="86%" r="55%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0b0e" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Gold Metallic Gradient -->
    <linearGradient id="gold3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4ba"/>
      <stop offset="18%" stop-color="#f7d983"/>
      <stop offset="42%" stop-color="#d4af37"/>
      <stop offset="65%" stop-color="#9a741a"/>
      <stop offset="85%" stop-color="#f0cb64"/>
      <stop offset="100%" stop-color="#997015"/>
    </linearGradient>

    <!-- Gold Accent Light -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8d6"/>
      <stop offset="50%" stop-color="#e2bf57"/>
      <stop offset="100%" stop-color="#9e771b"/>
    </linearGradient>

    <!-- Gold Shadow for Bevel -->
    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3507"/>
      <stop offset="100%" stop-color="#1a1302"/>
    </linearGradient>

    <!-- Gold Frame Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a741a" stop-opacity="0.4"/>
      <stop offset="25%" stop-color="#ffd966" stop-opacity="0.8"/>
      <stop offset="55%" stop-color="#b88f28" stop-opacity="0.5"/>
      <stop offset="85%" stop-color="#ffd966" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#735414" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Fine Leather Texture Pattern -->
    <pattern id="leatherGrain" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#ffffff" fill-opacity="0.015"/>
      <circle cx="6" cy="6" r="0.9" fill="#000000" fill-opacity="0.14"/>
      <circle cx="6" cy="2" r="0.8" fill="#ffffff" fill-opacity="0.01"/>
      <circle cx="2" cy="6" r="0.8" fill="#000000" fill-opacity="0.10"/>
    </pattern>

    <!-- Drop Shadows -->
    <filter id="shadowHeavy" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.95"/>
    </filter>

    <filter id="shadowMedium" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ffe680" flood-opacity="0.35"/>
    </filter>

    <filter id="toolFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- 1. Background Base -->
  <rect width="1080" height="1920" fill="#0c0d10"/>

  <!-- 2. Warm Spotlight Effect from Upper-Right -->
  <rect width="1080" height="1920" fill="url(#topRightGlow)"/>

  <!-- 3. Bottom Tool Glow -->
  <rect width="1080" height="1920" fill="url(#bottomToolGlow)"/>

  <!-- 4. Grain / Leather Texture Overlay -->
  <rect width="1080" height="1920" fill="url(#leatherGrain)"/>

  <!-- 5. Elegant Gold Border Inset Frame -->
  <rect x="36" y="36" width="1008" height="1848" rx="3" fill="none" stroke="url(#frameGrad)" stroke-width="2.5"/>
  <rect x="42" y="42" width="996" height="1836" rx="2" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.25"/>

  <!-- 6. TOP TAGLINE: "A SUA BARBEARIA PREMIUM" -->
  <g transform="translate(540, 155)" text-anchor="middle" filter="url(#shadowMedium)">
    <!-- Shadow -->
    <text class="tagline" fill="#000000" y="3">A SUA BARBEARIA PREMIUM</text>
    <!-- Main gold text -->
    <text class="tagline" fill="url(#gold3D)" y="0">A SUA BARBEARIA PREMIUM</text>
  </g>

  <!-- 7. CENTER EMBLEM: SCISSORS + L & B MONOGRAM -->
  <g transform="translate(540, 680)" filter="url(#shadowHeavy)">

    <!-- HORIZONTAL BARS FOR 'L' (Left) -->
    <path d="M-360 -115 L-115 -115" stroke="url(#gold3D)" stroke-width="8.5" stroke-linecap="round"/>
    <path d="M-360 115 L-115 115" stroke="url(#gold3D)" stroke-width="8.5" stroke-linecap="round"/>

    <!-- LETTER 'L' (Vintage Victorian Carved Serif) -->
    <g transform="translate(-237, 8)" fill="url(#gold3D)">
      <!-- 3D Shadow -->
      <path d="M-42 -88 L12 -88 L12 -68 L-14 -68 L-14 52 L38 52 L45 18 L62 18 L58 75 L-42 75 L-42 55 L-20 55 L-20 -68 L-42 -68 Z" 
            transform="translate(4, 6)" fill="url(#goldBevel)"/>
      <!-- Main Face with decorative spikes -->
      <path d="M-42 -88 L12 -88 L12 -68 L-14 -68 L-14 -12 L-4 -8 L-14 -4 L-14 52 L38 52 L45 18 L62 18 L58 75 L-42 75 L-42 55 L-20 55 L-20 0 L-32 -8 L-20 -16 L-20 -68 L-42 -68 Z" 
            stroke="#59430c" stroke-width="2"/>
      <!-- Surface highlight -->
      <path d="M-18 -66 L8 -66 M-18 -66 L-18 53 L36 53" stroke="#fff8d1" stroke-width="1.5" fill="none"/>
    </g>

    <!-- HORIZONTAL BARS FOR 'B' (Right) -->
    <path d="M115 -115 L360 -115" stroke="url(#gold3D)" stroke-width="8.5" stroke-linecap="round"/>
    <path d="M115 115 L360 115" stroke="url(#gold3D)" stroke-width="8.5" stroke-linecap="round"/>

    <!-- LETTER 'B' (Vintage Victorian Carved Serif) -->
    <g transform="translate(237, 8)" fill="url(#gold3D)">
      <!-- 3D Shadow -->
      <path d="M-42 -88 L22 -88 C48 -88 64 -72 64 -52 C64 -38 52 -28 38 -18 C56 -8 70 8 70 34 C70 60 48 75 18 75 L-42 75 L-42 55 L-20 55 L-20 -68 L-42 -68 Z" 
            transform="translate(4, 6)" fill="url(#goldBevel)"/>
      <!-- Main Face with decorative middle spur -->
      <path d="M-42 -88 L22 -88 C48 -88 64 -72 64 -52 C64 -38 52 -28 38 -18 C56 -8 70 8 70 34 C70 60 48 75 18 75 L-42 75 L-42 55 L-20 55 L-20 0 L-32 -8 L-20 -16 L-20 -68 L-42 -68 Z
               M-14 -24 L18 -24 C32 -24 42 -32 42 -52 C42 -68 32 -72 18 -72 L-14 -72 Z
               M-14 58 L18 58 C35 58 46 48 46 28 C46 10 35 0 18 0 L-14 0 Z" 
            stroke="#59430c" stroke-width="2"/>
      <!-- Surface highlight -->
      <path d="M-18 -66 L18 -66 C30 -66 38 -60 38 -52" stroke="#fff8d1" stroke-width="1.5" fill="none"/>
    </g>

    <!-- CENTRAL GOLDEN BARBER SCISSORS -->
    <g transform="translate(0, -25)" filter="url(#shadowMedium)">
      <!-- Left Scissor Blade (pointing up-left) -->
      <path d="M-12 45 L-20 12 L-72 -250 C-75 -275 -70 -290 -64 -300 C-54 -270 -22 -145 -2 -25 Z" 
            fill="url(#gold3D)" stroke="#664d0d" stroke-width="2"/>
      <!-- Right Scissor Blade (pointing up-right) -->
      <path d="M12 45 L20 12 L72 -250 C75 -275 70 -290 64 -300 C54 -270 22 -145 2 -25 Z" 
            fill="url(#gold3D)" stroke="#664d0d" stroke-width="2"/>

      <!-- Inner Cutting Edges Highlight Lines -->
      <path d="M-2 -25 L-62 -290" stroke="#fffde6" stroke-width="3" stroke-linecap="round"/>
      <path d="M2 -25 L62 -290" stroke="#fffde6" stroke-width="3" stroke-linecap="round"/>

      <!-- Central Pivot Screw -->
      <circle cx="0" cy="48" r="24" fill="url(#gold3D)" stroke="#4d3a08" stroke-width="3.5"/>
      <circle cx="0" cy="48" r="16" fill="#141108" stroke="#aa8222" stroke-width="2"/>
      <circle cx="0" cy="48" r="7" fill="url(#gold3D)"/>

      <!-- Scissor Shanks connecting to finger rings -->
      <path d="M-15 66 C-28 96 -50 132 -72 152 C-60 162 -42 126 -12 85 Z" fill="url(#gold3D)" stroke="#735414" stroke-width="1.5"/>
      <path d="M15 66 C28 96 50 132 72 152 C60 162 42 126 12 85 Z" fill="url(#gold3D)" stroke="#735414" stroke-width="1.5"/>

      <!-- Left Finger Ring Loop -->
      <path d="M-72 138 C-104 138 -135 170 -135 212 C-135 254 -104 286 -72 286 C-40 286 -14 254 -14 212 C-14 170 -40 138 -72 138 Z
               M-72 162 C-50 162 -34 182 -34 212 C-34 242 -50 262 -72 262 C-94 262 -112 242 -112 212 C-112 182 -94 162 -72 162 Z"
            fill="url(#gold3D)" stroke="#4a3606" stroke-width="3" fill-rule="evenodd"/>

      <!-- Right Finger Ring Loop -->
      <path d="M72 138 C40 138 14 170 14 212 C14 254 40 286 72 286 C104 286 135 254 135 212 C135 170 104 138 72 138 Z
               M72 162 C94 162 112 182 112 212 C112 242 94 262 72 262 C50 262 34 242 34 212 C34 182 50 162 72 162 Z"
            fill="url(#gold3D)" stroke="#4a3606" stroke-width="3" fill-rule="evenodd"/>

      <!-- Finger Rest (Tang) extending from right ring -->
      <path d="M128 232 C158 248 180 275 184 298 C180 304 164 298 146 278 C135 264 120 255 110 250 Z"
            fill="url(#gold3D)" stroke="#59430c" stroke-width="2"/>
    </g>
  </g>

  <!-- 8. BRAND NAME TYPOGRAPHY: "LÍDER BARBER'S" -->
  <g transform="translate(540, 1140)" text-anchor="middle" filter="url(#shadowHeavy)">
    <!-- 3D Extrusion Shadow (Deepest Layer 4) -->
    <text class="brand-name" fill="#000000" y="24">LÍDER BARBER&apos;S</text>

    <!-- 3D Extrusion Layer 3 -->
    <text class="brand-name" fill="#241903" y="18">LÍDER BARBER&apos;S</text>

    <!-- 3D Extrusion Layer 2 -->
    <text class="brand-name" fill="#4d3607" y="12">LÍDER BARBER&apos;S</text>

    <!-- 3D Extrusion Layer 1 (Bevel Edge) -->
    <text class="brand-name" fill="#876212" y="6">LÍDER BARBER&apos;S</text>

    <!-- Front Face (Gold Metallic Gradient with Dark Bevel Border) -->
    <text class="brand-name" fill="url(#gold3D)" stroke="#382604" stroke-width="3" y="0">LÍDER BARBER&apos;S</text>

    <!-- Front Top Crisp Golden Highlight Line -->
    <text class="brand-name" fill="none" stroke="#fffceb" stroke-width="1.2" stroke-opacity="0.75" y="-1.5">LÍDER BARBER&apos;S</text>
  </g>

  <!-- 9. BOTTOM WATERMARK: VINTAGE BARBER TOOLS LINE-ART ENGRAVING -->
  <g transform="translate(540, 1680)" filter="url(#toolFilter)">
    <g stroke="url(#gold3D)" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.30">

      <!-- STRAIGHT RAZOR (Navalhete Aberto) - Left / Center -->
      <g transform="translate(-270, -10) rotate(-26)">
        <!-- Razor Handle (Scales) -->
        <path d="M-230 0 C-150 -28 40 -28 190 0 C206 5 220 22 210 35 C200 45 174 42 148 40 C22 26 -150 30 -230 14 C-246 10 -250 -2 -230 0 Z" 
              stroke-width="4.5" fill="#0d0e12" fill-opacity="0.45"/>
        <!-- Pivot Pin -->
        <circle cx="170" cy="14" r="7.5" stroke-width="4" fill="#d4af37"/>
        <circle cx="170" cy="14" r="2.5" fill="#000000"/>
        <!-- Tang & Blade Shank -->
        <path d="M170 14 C198 3 224 3 260 12 C286 20 308 38 340 44" stroke-width="5.5"/>
        <!-- Blade Face with Hollow Ground Edge -->
        <path d="M260 12 L276 -32 L476 -32 C518 -32 540 -16 550 5 L530 27 L286 22 Z" 
              stroke-width="5" fill="#0d0e12" fill-opacity="0.55"/>
        <line x1="298" y1="-16" x2="508" y2="-16" stroke-width="2.5" stroke-dasharray="12 6"/>
        <path d="M524 -30 C535 -16 540 6 520 22" stroke-width="3"/>
      </g>

      <!-- SHAVING BRUSH (Pincel Tradicional) - Center -->
      <g transform="translate(15, 30) rotate(14)">
        <!-- Brush Handle -->
        <path d="M-58 125 C-68 85 -42 54 -38 22 C-48 12 -48 -10 -38 -22 L38 -22 C48 -10 48 12 38 22 C42 54 68 85 58 125 C42 156 -42 156 -58 125 Z" 
              stroke-width="5" fill="#0c0d10" fill-opacity="0.5"/>
        <path d="M-38 22 L38 22" stroke-width="4"/>
        <path d="M-32 65 C-10 74 10 74 32 65" stroke-width="3"/>
        <path d="M-42 105 C-15 118 15 118 42 105" stroke-width="3"/>
        <!-- Metal Ring / Ferrule -->
        <rect x="-38" y="-38" width="76" height="16" rx="3" stroke-width="4.5"/>
        <!-- Badger Hair Bristles -->
        <path d="M-38 -38 C-75 -95 -90 -168 -48 -230 C-16 -262 16 -262 48 -230 C90 -168 75 -95 38 -38 Z" 
              stroke-width="5.5" fill="#0e0f13" fill-opacity="0.45"/>
        <path d="M-22 -38 C-48 -100 -58 -170 -26 -225" stroke-width="2.8"/>
        <path d="M0 -38 C-10 -105 -5 -180 0 -235" stroke-width="2.8"/>
        <path d="M22 -38 C48 -100 58 -170 26 -225" stroke-width="2.8"/>
        <!-- Dark band on bristles -->
        <path d="M-62 -135 C-20 -152 20 -152 62 -135" stroke-width="4.5" stroke-dasharray="8 5"/>
      </g>

      <!-- BARBER COMB (Pente de Barbeiro Clássico) - Right -->
      <g transform="translate(270, 10) rotate(54)">
        <path d="M-200 -24 L200 -24 C216 -24 228 -10 228 6 C228 22 216 32 200 32 L-200 32 C-216 32 -228 22 -228 6 C-228 -10 -216 -24 -200 -24 Z" 
              stroke-width="5" fill="#0d0e11" fill-opacity="0.45"/>
        <!-- Teeth -->
        <path d="
          M-190 32 L-190 145 M-178 32 L-178 145 M-166 32 L-166 145 M-154 32 L-154 145 M-142 32 L-142 145
          M-130 32 L-130 145 M-118 32 L-118 145 M-106 32 L-106 145 M-94 32 L-94 145 M-82 32 L-82 145
          M-70 32 L-70 145 M-58 32 L-58 145 M-46 32 L-46 145 M-34 32 L-34 145 M-22 32 L-22 145
          M-10 32 L-10 145 M2 32 L2 145 M14 32 L14 145 M26 32 L26 145 M38 32 L38 145
          M50 32 L50 145 M62 32 L62 145 M74 32 L74 145 M86 32 L86 145 M98 32 L98 145
          M110 32 L110 145 M122 32 L122 145 M134 32 L134 145 M146 32 L146 145 M158 32 L158 145
          M170 32 L170 145 M182 32 L182 145 M194 32 L194 145" stroke-width="3"/>
      </g>

      <!-- SAFETY RAZOR (Aparelho Vintage) - Far Right -->
      <g transform="translate(435, 150) rotate(-14)">
        <path d="M-62 0 C-42 -22 42 -22 62 0 L56 26 L-56 26 Z" stroke-width="5" fill="#0d0e12" fill-opacity="0.45"/>
        <line x1="-56" y1="26" x2="56" y2="26" stroke-width="5.5"/>
        <rect x="-15" y="26" width="30" height="190" rx="6" stroke-width="5"/>
        <!-- Knurling texture -->
        <line x1="-15" y1="65" x2="15" y2="76" stroke-width="2.5"/>
        <line x1="-15" y1="88" x2="15" y2="99" stroke-width="2.5"/>
        <line x1="-15" y1="110" x2="15" y2="121" stroke-width="2.5"/>
        <line x1="-15" y1="132" x2="15" y2="143" stroke-width="2.5"/>
        <line x1="-15" y1="154" x2="15" y2="165" stroke-width="2.5"/>
        <line x1="-15" y1="176" x2="15" y2="187" stroke-width="2.5"/>
      </g>
    </g>
  </g>
</svg>