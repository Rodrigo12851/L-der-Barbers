<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa8222"/>
      <stop offset="100%" stop-color="#e6c86e"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20"/>
      <stop offset="100%" stop-color="#0b0c0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#gold)" stroke-width="3" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="180" fill="url(#glow)"/>

  <!-- Ornate Frame Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="4 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.8"/>

  <!-- Crossed Razors / Classic Barber Shears Symbol -->
  <g transform="translate(256, 230)" stroke="url(#gold)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Barber Crown / Comb Crest -->
    <path d="M-40 -80 L-20 -105 L0 -85 L20 -105 L40 -80 Z" fill="url(#gold)" opacity="0.85" stroke-width="2"/>
    <circle cx="0" cy="-60" r="6" fill="url(#gold)"/>

    <!-- Left Shear Blade -->
    <path d="M-80 60 L-10 -30 L5 -10 L-60 80 Z" fill="url(#gold)" stroke-width="2"/>
    <circle cx="-75" cy="85" r="18" stroke-width="4" stroke="url(#gold)"/>

    <!-- Right Shear Blade -->
    <path d="M80 60 L10 -30 L-5 -10 L60 80 Z" fill="url(#gold)" stroke-width="2"/>
    <circle cx="75" cy="85" r="18" stroke-width="4" stroke="url(#gold)"/>

    <!-- Center Pivot Gem -->
    <circle cx="0" cy="-5" r="7" fill="#0d0e11" stroke="url(#gold)" stroke-width="3"/>
    <circle cx="0" cy="-5" r="3" fill="url(#gold)"/>
  </g>

  <!-- Monogram & Typography -->
  <text x="256" y="380" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="34" font-weight="800" letter-spacing="6" fill="url(#gold)">LIBERDADE</text>
  <text x="256" y="415" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" letter-spacing="8" fill="#9ca3af">BARBEARIA</text>
  <text x="256" y="435" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" letter-spacing="3" fill="#d4af37" opacity="0.7">EST. 2018</text>
</svg>
